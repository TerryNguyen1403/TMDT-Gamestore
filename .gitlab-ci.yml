stages:
    - build
    - push
    - deploy

build:
    stage: build
    variables:
        GIT_STRATEGY: clone
    script:
        - docker build -t $DOCKER_USERNAME/$PROJECT_NAME-server:$CI_COMMIT_TAG -f server/Dockerfile server
        - docker build -t $DOCKER_USERNAME/$PROJECT_NAME-client:$CI_COMMIT_TAG -f client/Dockerfile client
    tags:
        - gamestore-runner
    rules:
        - if: $CI_COMMIT_TAG

push:
    stage: push
    variables:
        GIT_STRATTEGY: none
    script:
        - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
        - docker push $DOCKER_USERNAME/$PROJECT_NAME-server:$CI_COMMIT_TAG
        - docker push $DOCKER_USERNAME/$PROJECT_NAME-client:$CI_COMMIT_TAG
    tags:
        - gamestore-runner
    rules:
        - if: $CI_COMMIT_TAG

deploy:
    stage: deploy
    variables:
        GIT_STRATEGY: clone
        IMAGE_TAG: $CI_COMMIT_TAG
    script:
        - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
        - docker compose build
        - docker compose up -d
        - docker compose logs --tail=20 server