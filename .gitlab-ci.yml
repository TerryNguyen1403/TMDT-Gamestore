stages:
    - build
    - push
    - deploy

build:
    stage: build
    variables:
        GIT_STRATEGY: clone
    script:
        - echo "DOCKER_USERNAME=$DOCKER_USERNAME"
        - echo "PROJECT_NAME=$PROJECT_NAME"
        - echo "CI_COMMIT_TAG=$CI_COMMIT_TAG"
        - docker build -t $DOCKER_USERNAME/$PROJECT_NAME-server:$CI_COMMIT_TAG -f server/Dockerfile server
        - docker build -t $DOCKER_USERNAME/$PROJECT_NAME-client:$CI_COMMIT_TAG -f client/Dockerfile client
        - docker images
    tags:
        - gamestore-runner
    rules:
        - if: $CI_COMMIT_TAG